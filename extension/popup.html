<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fbfaf7; --fg:#1d1d1b; --muted:#5f5d57; --line:#e4e1d8; --accent:#1f7a4d; --accent-fg:#fff; --soft:#e5f2ea; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141513; --fg:#ecebe6; --muted:#a3a19a; --line:#33352f; --accent:#4cc285; --accent-fg:#0d1a12; --soft:#1d3326; --card:#1d1f1c; } }
  body { margin:0; width:330px; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { padding:12px 14px; border-bottom:1px solid var(--line); font-weight:700; }
  header small { display:block; font-weight:400; color:var(--muted); }
  main { padding:10px 14px; }
  .ask { background:var(--soft); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .ask p { margin:0 0 8px; }
  .code { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:8px; }
  .row { display:flex; align-items:center; gap:8px; }
  .row b { font-family:ui-monospace,Consolas,monospace; font-size:15px; flex:1; overflow-wrap:anywhere; }
  .chip { font-size:12px; border-radius:99px; padding:1px 8px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .chip.verified { color:var(--accent); border-color:var(--accent); }
  .meta { color:var(--muted); font-size:12.5px; margin-top:2px; }
  button { font:inherit; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--fg); padding:3px 9px; cursor:pointer; }
  button.p { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  h3 { font-size:13px; margin:14px 0 6px; }
  form { display:flex; flex-direction:column; gap:6px; }
  input[type=text] { font:inherit; padding:6px 8px; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  .muted { color:var(--muted); }
  footer { border-top:1px solid var(--line); padding:8px 14px 12px; font-size:12.5px; color:var(--muted); }
  footer p { margin:4px 0; } footer a { color:var(--accent); margin-right:10px; }
</style>
</head>
<body>
<header>Good Codes <small id="domain"></small></header>
<main>
  <div id="ask" class="ask" hidden></div>
  <div id="list" class="muted">Loading…</div>
  <div id="share" hidden>
    <h3>Got a code for this shop? Share it</h3>
    <form id="submit">
      <input type="text" name="code" placeholder="Code, e.g. SAVE10" maxlength="40" required>
      <button type="submit">Share code</button>
      <span id="submit-msg" class="muted"></span>
    </form>
    <p class="muted" style="font-size:12.5px">Only share codes meant for everyone, not ones sent just to you.</p>
  </div>
</main>
<footer>
  <p id="alerts"></p>
  <p><strong>Free while we test it.</strong> We'll probably charge later, and we'll ask first. Nobody gets charged without agreeing.</p>
  <p><a id="bmc" href="#" target="_blank" rel="noopener" hidden>☕ Buy me a coffee</a> <a id="site" href="#" target="_blank" rel="noopener">About, privacy &amp; security</a></p>
</footer>
<script type="module" src="popup.js"></script>
</body>
</html>
